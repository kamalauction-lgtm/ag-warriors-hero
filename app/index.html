<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AG Warriors" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600;700&family=Anton&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous" />
    <title>IQI AG Warriors</title>
    <script>
      /* The app moved from hash routing to real URLs. Links already shared as
         hero.iqiaggroup.com/#/testme (or #/join/CODE) must keep working, so
         translate any legacy hash route back into a real path before React boots. */
      (function () {
        var h = window.location.hash;
        if (h && h.startsWith('#/')) {
          window.location.replace(h.slice(1) + window.location.search);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* Installability only — the worker is a pass-through and caches nothing
         (see public/sw.js for why that is a hard rule in this project). */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
